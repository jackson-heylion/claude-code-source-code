name: Mission 5 verifier v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mission5-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install comparator-compatible landrun
        shell: bash
        run: |
          set -euxo pipefail
          go install github.com/zouuup/landrun/cmd/landrun@f59e83dbb4fd0af584dec5091168d0b35c8410b7
          mv "$HOME/go/bin/landrun" "$HOME/go/bin/landrun-real"
          cat > "$HOME/go/bin/landrun" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          opts=()
          while (($#)); do
            case "$1" in
              --best-effort|--ldd|-ldd|--add-exec|-add-exec|--unrestricted-filesystem|--unrestricted-network)
                opts+=("$1"); shift ;;
              --ro|--rw|--rox|--rwx|--env|--bind-tcp|--connect-tcp|--log-level)
                opts+=("$1" "$2"); shift 2 ;;
              *)
                exec "$(dirname "$0")/landrun-real" "${opts[@]}" -- "$@" ;;
            esac
          done
          echo "landrun wrapper: missing child command" >&2
          exit 2
          SH
          chmod +x "$HOME/go/bin/landrun"
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
          "$HOME/go/bin/landrun-real" --version

      - name: Sparse checkout mission and verifier
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/timqian/mission.land.git mission-land
          git -C mission-land sparse-checkout set missions/5-erdos-straus tools/lean

      - name: Verify exact control witness
        shell: bash
        run: |
          set -o pipefail
          python3 mission-land/missions/5-erdos-straus/verify.py "$GITHUB_WORKSPACE/mission5v2/baseline.json" 2>&1 | tee baseline.log
          grep -q "VALID score=0" baseline.log

      - name: Test current string-literal candidate
        id: current_attack
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          rm -rf mission-land/missions/5-erdos-straus/challenge/.lake/build/lib/lean/Init \
            mission-land/missions/5-erdos-straus/challenge/.lake/build/lib/lean/Init.olean \
            mission-land/missions/5-erdos-straus/challenge/.lake/build/lib/lean/Init.olean.server \
            mission-land/missions/5-erdos-straus/challenge/.lake/build/lib/lean/Init.olean.private
          python3 mission-land/missions/5-erdos-straus/verify.py "$GITHUB_WORKSPACE/mission5v2/reducebool-nocheck.json" 2>&1 | tee candidate.log

      - name: Build machine-readable result
        if: always()
        shell: bash
        run: |
          {
            echo "baseline=$(grep -q 'VALID score=0' baseline.log && echo PASS || echo FAIL)"
            echo "candidate=$(grep -q 'VALID score=1' candidate.log && echo ACCEPTED || echo REJECTED)"
            echo "=== baseline ==="; cat baseline.log || true
            echo "=== current candidate ==="; cat candidate.log || true
          } > result.txt
          cat result.txt

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission5-verifier-result
          path: |
            result.txt
            baseline.log
            candidate.log
