name: Mission 5 verifier v2

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain manager
        shell: bash
        run: |
          set -euxo pipefail
          curl -sSf https://elan.lean-lang.org/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Sparse checkout mission and verifier
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/timqian/mission.land.git mission-land
          git -C mission-land sparse-checkout set missions/5-erdos-straus tools/lean

      - name: Verify exact control witness
        shell: bash
        run: |
          set -o pipefail
          python3 mission-land/missions/5-erdos-straus/verify.py "$GITHUB_WORKSPACE/mission5v2/baseline.json" 2>&1 | tee baseline.log
          grep -q "VALID score=0" baseline.log

      - name: Test import-boundary candidate
        id: import_attack
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 mission-land/missions/5-erdos-straus/verify.py "$GITHUB_WORKSPACE/mission5v2/import-challenge.json" 2>&1 | tee import.log

      - name: Test malformed-olean candidate
        id: olean_attack
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 mission-land/missions/5-erdos-straus/verify.py "$GITHUB_WORKSPACE/mission5v2/olean-attack.json" 2>&1 | tee olean.log

      - name: Build machine-readable result
        if: always()
        shell: bash
        run: |
          {
            echo "baseline=$(grep -q 'VALID score=0' baseline.log && echo PASS || echo FAIL)"
            echo "import=$(grep -q 'VALID score=1' import.log && echo ACCEPTED || echo REJECTED)"
            echo "olean=$(grep -q 'VALID score=1' olean.log && echo ACCEPTED || echo REJECTED)"
            echo "=== baseline ==="; cat baseline.log || true
            echo "=== import candidate ==="; cat import.log || true
            echo "=== olean candidate ==="; cat olean.log || true
          } > result.txt
          cat result.txt

      - name: Upload verifier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mission5-verifier-result
          path: |
            result.txt
            baseline.log
            import.log
            olean.log
